[project]
name = "rungent"
version = "0.2.2"
description = "A small, typed agent runtime for Python applications"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Rungent Contributors" }]
keywords = ["agent", "llm", "tool-calling", "fastapi", "sse"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
]

[project.urls]
Homepage = "https://github.com/rungent/rungent"
Documentation = "https://github.com/rungent/rungent/tree/main/docs"
Repository = "https://github.com/rungent/rungent"
Issues = "https://github.com/rungent/rungent/issues"
Changelog = "https://github.com/rungent/rungent/releases"

[project.optional-dependencies]
fastapi = ["fastapi>=0.115.0"]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0.36"]
dev = [
  "aiosqlite>=0.20.0",
  "fastapi>=0.115.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pyright>=1.1.0",
  "ruff>=0.8.0",
  "sqlalchemy[asyncio]>=2.0.36",
]

[project.scripts]
rungent = "rungent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rungent"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/rungent",
  "/README.md",
  "/RUNGENT.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
